<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Parallel Chat</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="drag-overlay">파일을 여기에 놓으세요</div>
  <div class="iframe-shield"></div>

  <!-- Main area: panels + always-visible sessions sidebar -->
  <div class="main-area">

    <!-- Sessions sidebar (always visible, left side) -->
    <div id="sessions-sidebar" class="sessions-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Sessions</span>
      </div>
      <button id="saveSidebarBtn" class="sidebar-save-btn">&#43; 현재 세션 저장</button>
      <div id="sessionsList" class="sessions-list"></div>
    </div>

    <!-- AI iframe panels -->
    <div id="panels-container">
      <div class="panel" id="panel-chatgpt">
        <div class="panel-header" id="panel-header-chatgpt">
          <span class="panel-dot gpt"></span>
          <span class="panel-name">ChatGPT</span>
          <span class="panel-toggle-hint"></span>
          <button class="panel-reload-btn" data-key="chatgpt" title="이 패널 새로고침">↺</button>
        </div>
        <div class="panel-loading" id="loading-chatgpt">
          <div class="loading-spinner"></div>
        </div>
        <div class="panel-onboarding" id="onboarding-chatgpt" data-key="chatgpt">
          <button class="onboarding-close" aria-label="안내 닫기">×</button>
          <div class="onboarding-body">
            <span class="onboarding-icon">🤖</span>
            <strong class="onboarding-name">ChatGPT</strong>
            <ol class="onboarding-steps">
              <li>먼저 로그인하세요</li>
              <li>입력하고 Send All 클릭</li>
            </ol>
            <button class="onboarding-link-btn" data-url="https://chatgpt.com/">chatgpt.com으로 이동</button>
          </div>
        </div>
        <iframe id="iframe-chatgpt" src="https://chatgpt.com/" title="ChatGPT"></iframe>
      </div>
      <div class="panel-divider" data-left="chatgpt" data-right="gemini"></div>
      <div class="panel" id="panel-gemini">
        <div class="panel-header" id="panel-header-gemini">
          <span class="panel-dot gemini"></span>
          <span class="panel-name">Gemini</span>
          <span class="panel-toggle-hint"></span>
          <button class="panel-reload-btn" data-key="gemini" title="이 패널 새로고침">↺</button>
        </div>
        <div class="panel-loading" id="loading-gemini">
          <div class="loading-spinner"></div>
        </div>
        <div class="panel-onboarding" id="onboarding-gemini" data-key="gemini">
          <button class="onboarding-close" aria-label="안내 닫기">×</button>
          <div class="onboarding-body">
            <span class="onboarding-icon">✨</span>
            <strong class="onboarding-name">Gemini</strong>
            <ol class="onboarding-steps">
              <li>먼저 로그인하세요</li>
              <li>입력하고 Send All 클릭</li>
            </ol>
            <button class="onboarding-link-btn" data-url="https://gemini.google.com/app">Gemini 사이트로 이동</button>
          </div>
        </div>
        <iframe id="iframe-gemini" src="https://gemini.google.com/app" title="Gemini"></iframe>
      </div>
      <div class="panel-divider" data-left="gemini" data-right="claude"></div>
      <div class="panel" id="panel-claude">
        <div class="panel-header" id="panel-header-claude">
          <span class="panel-dot claude"></span>
          <span class="panel-name">Claude</span>
          <span class="panel-toggle-hint"></span>
          <button class="panel-reload-btn" data-key="claude" title="이 패널 새로고침">↺</button>
        </div>
        <div class="panel-loading" id="loading-claude">
          <div class="loading-spinner"></div>
        </div>
        <div class="claude-notice" id="claude-notice">
          <span class="claude-notice-text">대화는 정상 저장됩니다. 이전 대화 목록은 <a href="https://claude.ai/chats" target="_blank" rel="noopener">claude.ai/chats</a> 에서 확인하세요.</span>
          <button class="claude-notice-close" aria-label="안내 닫기" title="안내 닫기">×</button>
        </div>
        <div class="panel-onboarding" id="onboarding-claude" data-key="claude">
          <button class="onboarding-close" aria-label="안내 닫기">×</button>
          <div class="onboarding-body">
            <span class="onboarding-icon">🔶</span>
            <strong class="onboarding-name">Claude</strong>
            <ol class="onboarding-steps">
              <li>먼저 로그인하세요</li>
              <li>입력하고 Send All 클릭</li>
            </ol>
            <button class="onboarding-link-btn" data-url="https://claude.ai/">Claude 사이트로 이동</button>
          </div>
        </div>
        <iframe id="iframe-claude" src="https://claude.ai/new" title="Claude"></iframe>
      </div>
    </div>

  </div>

  <!-- Control panel vertical resize handle -->
  <div id="control-resizer"></div>

  <!-- Integrated control panel -->
  <div id="control-panel">

    <!-- Always-visible top bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <span class="title">PARALLEL CHAT</span>
        <a href="privacy.html" target="_blank" class="privacy-link">Privacy</a>
        <div class="ai-toggles">
          <button class="ai-toggle-btn" id="toggle-chatgpt" data-key="chatgpt">
            <span class="ai-toggle-dot gpt"></span><span>GPT</span>
          </button>
          <button class="ai-toggle-btn" id="toggle-gemini" data-key="gemini">
            <span class="ai-toggle-dot gemini"></span><span>Gemini</span>
          </button>
          <button class="ai-toggle-btn" id="toggle-claude" data-key="claude">
            <span class="ai-toggle-dot claude"></span><span>Claude</span>
          </button>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" id="relaunchBtn" title="현재 URL 유지 리로드">&#8635; Reload</button>
        <button class="icon-btn danger" id="newSessionBtn" title="새 세션 (초기화)">&#43; New</button>
        <button class="icon-btn" id="langBtn" title="언어 전환">EN</button>
        <button class="icon-btn" id="themeBtn" title="AI 서비스 테마 전환">☀️ Light</button>
        <button class="toggle-btn" id="toggleBtn" title="접기 / 펼치기">&#9660;</button>
      </div>
    </div>

    <!-- Collapsible main content -->
    <div class="main-content" id="mainContent">
      <div class="input-container">
        <div class="file-list" id="fileList"></div>
        <textarea id="input" placeholder="메시지를 입력하면 선택된 AI에 동시 전송됩니다..." rows="1"></textarea>
        <div class="input-footer">
          <button class="file-attach-btn" id="attachBtn" title="파일 첨부">&#128206; 파일</button>
          <input type="file" id="fileInput" multiple>
          <span id="sendFeedback"></span>
          <button class="send-btn" id="sendBtn">&#9650; Send All</button>
        </div>
      </div>
    </div>

  </div>

  <script src="viewer.js"></script>
</body>
</html>
